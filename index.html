<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная платформа подбора ПК</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="scss/main.css">
</head>
<body class="page">
    
    <header class="header">
        <div class="header__container container">
            <a href="#" class="header__logo">
                <span class="header__logo-accent">PC</span>Config
            </a>
            
            <nav class="header__nav">
                <div class="header__tabs">
                    <button class="header__tab header__tab--active" data-target="components">Комплектующие</button>
                    <button class="header__tab" data-target="builds">Готовые сборки</button>
                </div>
            </nav>

            <button class="header__cart-btn" id="open-cart">
                <svg class="header__cart-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="header__cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <main class="main-content container">
        
        <aside class="sidebar">
            <div class="sidebar__header">
                <h2 class="sidebar__title">Фильтры</h2>
            </div>
            
            <div class="sidebar__group">
                <h3 class="sidebar__group-title">Категория</h3>
                <div class="sidebar__checkboxes">
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="all" checked>
                        <span class="sidebar__text">Все товары</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="cpu">
                        <span class="sidebar__text">Процессоры</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="gpu">
                        <span class="sidebar__text">Видеокарты</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="motherboard">
                        <span class="sidebar__text">Материнские платы</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="ram">
                        <span class="sidebar__text">Оперативная память</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="ssd-nvme">
                        <span class="sidebar__text">Накопители М.2 NVMe</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="ssd-sata">
                        <span class="sidebar__text">Накопители SATA SSD</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="radio" name="category" class="sidebar__input" value="hdd">
                        <span class="sidebar__text">Жесткие диски</span>
                    </label>
                </div>
            </div>

            <div class="sidebar__group">
                <h3 class="sidebar__group-title">Цена (₽)</h3>
                <div class="sidebar__range">
                    <input type="number" class="sidebar__range-input" id="price-min" placeholder="От">
                    <span class="sidebar__range-separator">-</span>
                    <input type="number" class="sidebar__range-input" id="price-max" placeholder="До">
                </div>
            </div>

            <div class="sidebar__group">
                <h3 class="sidebar__group-title">Сокет</h3>
                <div class="sidebar__checkboxes">
                    <label class="sidebar__label">
                        <input type="checkbox" class="sidebar__input" value="LGA1700">
                        <span class="sidebar__text">LGA1700</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="checkbox" class="sidebar__input" value="AM5">
                        <span class="sidebar__text">AM5</span>
                    </label>
                    <label class="sidebar__label">
                        <input type="checkbox" class="sidebar__input" value="AM4">
                        <span class="sidebar__text">AM4</span>
                    </label>
                </div>
            </div>
            <div class="sidebar__header">
                <button type="reset" class="sidebar__reset-btn" id="reset-filters">Сбросить</button>
            </div>
        </aside>

        <section class="catalog">
            <div class="catalog__toolbar">
                <div class="catalog__search-wrapper">
                    <input type="text" class="catalog__search" id="search-input" placeholder="Поиск комплектующих...">
                </div>
                <div class="catalog__sort-wrapper">
                    <select class="catalog__sort" id="sort-select">
                        <option value="popular">Сначала популярные</option>
                        <option value="price-asc">Сначала дешевле</option>
                        <option value="price-desc">Сначала дороже</option>
                        <option value="performance">По производительности</option>
                    </select>
                </div>
            </div>
            
            <div class="catalog__grid" id="catalog-grid">
                </div>
        </section>
        
    </main>

    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-drawer__overlay" id="cart-overlay"></div>
        <div class="cart-drawer__content">
            <div class="cart-drawer__header">
                <h2 class="cart-drawer__title">Ваша сборка</h2>
                <button class="cart-drawer__close" id="close-cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div class="cart-drawer__list" id="cart-list">
                </div>
            
            <div class="cart-drawer__footer">
                <div class="cart-drawer__total">
                    <span class="cart-drawer__total-label">Итого:</span>
                    <span class="cart-drawer__total-value" id="cart-total-price">0 ₽</span>
                </div>
                
                <div class="cart-drawer__actions">
                    <button class="btn btn--primary cart-drawer__btn" id="btn-checkout">Оформить заказ</button>
                    <button class="btn btn--secondary cart-drawer__btn" id="btn-auto-pick">Подобрать детали</button>
                    <button class="btn btn--accent cart-drawer__btn" id="btn-suggest-build">Подобрать готовый ПК</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-assistant">
        <div class="modal__overlay" id="modal-overlay"></div>
        <div class="modal__content">
            <button class="modal__close" id="close-modal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
            <div class="modal__header">
                <h3 class="modal__title" id="modal-title">Анализ совместимости</h3>
            </div>
            <div class="modal__body" id="modal-body">
                </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
